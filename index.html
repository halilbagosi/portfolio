<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="{{site.description}}" />
    <title>{{site.title}}</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <p id="hint-top" class="hint"></p>
    <p id="hint" class="hint">Click to open</p>
    <nav id="a11y" class="sr-only" aria-label="Portfolio"></nav>
    <noscript><p class="fallback">{{site.noscript}}</p></noscript>
    <div id="fallback" hidden>
      <h1>{{site.name}}</h1>
      <p>{{site.role}}</p>
      <section id="fallback-about" aria-label="About"></section>
      <ul id="fallback-list"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
